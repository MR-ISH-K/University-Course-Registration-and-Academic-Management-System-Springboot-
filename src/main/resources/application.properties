spring.application.name=university-academic-system

# PostgreSQL (create the database first:  CREATE DATABASE university_academic_db;)
spring.datasource.url=jdbc:postgresql://localhost:5432/university_academic_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8084

# Hibernate / JPA: generate and update tables from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
